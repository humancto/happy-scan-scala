[package]
name = "scala-dep-scan"
version = "0.4.0"
edition = "2021"
description = "Fast, zero-dependency Rust CLI for scanning Scala/Play/SBT projects for vulnerable, outdated, and unused dependencies"
authors = ["humancto"]
license = "Apache-2.0"
repository = "https://github.com/humancto/happy-scan-scala"
homepage = "https://github.com/humancto/happy-scan-scala"
readme = "README.md"
keywords = ["scala", "sbt", "security", "vulnerability", "dependency-scanner"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.70"

[[bin]]
name = "scala-dep-scan"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
petgraph = "0.6"
regex = "1"
indicatif = "=0.17.7"
semver = "1"
anyhow = "1"
serde_yaml = "0.9"
ureq = { version = "2", features = ["json"] }
crossterm = "0.27"
ratatui = "0.26"

[profile.release]
opt-level = 3

